<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
    }

    body {            
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-image: url('https://images.unsplash.com/photo-1504384308090-c894fdcc538d?auto=format&fit=crop&w=1950&q=80');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .register-box {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      padding: 40px 35px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      color: #fff;
      width: 100%;
      max-width: 400px;
    }

    .register-box h2 {
      text-align: center;
      margin-bottom: 25px;
      font-size: 28px;
      color: #ffffff;
    }

    .register-box input,
    .register-box select {
      width: 100%;
      padding: 12px 15px;
      margin: 10px 0 20px 0;
      border: none;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.25);
      color: #fff;
      font-size: 16px;
    }

    .register-box input::placeholder {
      color: #eee;
    }

    .register-box select {
      color: #fff;
      background: rgba(255, 255, 255, 0.25);
    }

    .register-box button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(to right, #667eea, #764ba2);
      border: none;
      border-radius: 8px;
      font-size: 16px;
      color: white;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .register-box button:hover {
      background: linear-gradient(to right, #764ba2, #667eea);
    }

    .footer-link {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    .footer-link a {
      color: #ffffff;
      text-decoration: underline;
    }

    .footer-link a:hover {
      color: #cce6ff;
    }

    .home-icon {
  position: absolute;
  top: 20px;
  left: 20px;
  font-size: 15px;
  color: white;
  background-color: rgba(255, 255, 255, 0.2);
  padding: 10px;
  border-radius: 50%;
  text-decoration: none;
  transition: all 0.3s;
  backdrop-filter: blur(6px);
}

.home-icon:hover {
  background-color: rgba(255, 255, 255, 0.4);
  color: black;
}
  </style>
</head>
<body>
  <a href="index.html" class="home-icon" title="Go to Home">
    <i class="fas fa-home"></i> Home
  </a>
  <div class="register-box">
    <h2>Create Your Account</h2>
    <form id="registerForm">
      <input type="text" id="name" placeholder="Full Name" required />
      <input type="email" id="email" placeholder="Email Address" required />
      <input type="password" id="password" placeholder="Password" required />
      <select id="role" required>
        <option value="">Select Role</option>
        <option value="jobseeker">Job Seeker</option>
        <option value="employer">Employer</option>
        <option value="admin">Admin</option>
      </select>
      <button type="submit">Register</button>
    </form>
    <div class="footer-link">
      Already have an account? <a href="login.html">Login here</a>
    </div>
  </div>

<script>
  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
  
    const data = {
      name: document.getElementById('name').value,
      email: document.getElementById('email').value,
      password: document.getElementById('password').value,
      role: document.getElementById('role').value,
    };
  
    fetch('http://localhost:3001/register', { 
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data) 
    })
    .then(response => response.json())
    .then(result => {
      if (result.message === 'User registered successfully') {
        alert('Registration successful!');
        
        
        const role = data.role; 
        if (role === 'jobseeker') {
          window.location.href = 'seeker-login.html';
        } else if (role === 'employer') {
          window.location.href = 'employer-login.html';
        } else if (role === 'admin') {
          window.location.href = 'admin-login.html'; 
        }
      } else {
        alert('Registration failed: ' + result.message);
      }
    })
    .catch(error => console.error('Error:', error));
  });
  
</script>

</body>
</html>
