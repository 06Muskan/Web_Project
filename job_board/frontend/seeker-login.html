<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-image: url('https://images.unsplash.com/photo-1521737604893-d14cc237f11d?auto=format&fit=crop&w=1950&q=80');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-box {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      padding: 40px 35px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      color: #fff;
      width: 100%;
      max-width: 400px;
    }

    .login-box h2 {
      text-align: center;
      margin-bottom: 25px;
      font-size: 28px;
      color: #ffffff;
    }

    .login-box input,
    .login-box select {
      width: 100%;
      padding: 12px 15px;
      margin: 10px 0 20px 0;
      border: none;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.25);
      color: #fff;
      font-size: 16px;
    }

    .login-box input::placeholder {
      color: #eee;
    }

    .login-box select {
      color: #fff;
      background: rgba(255, 255, 255, 0.25);
    }

    .login-box button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(to right, #667eea, #764ba2);
      border: none;
      border-radius: 8px;
      font-size: 16px;
      color: white;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .login-box button:hover {
      background: linear-gradient(to right, #764ba2, #667eea);
    }

    .footer-link {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    .footer-link a {
      color: #ffffff;
      text-decoration: underline;
    }

    .footer-link a:hover {
      color: #cce6ff;
    }

  .home-icon {
  position: absolute;
  top: 20px;
  left: 20px;
  font-size: 15px;
  color: white;
  background-color: rgba(255, 255, 255, 0.2);
  padding: 10px;
  border-radius: 50%;
  text-decoration: none;
  transition: all 0.3s;
  backdrop-filter: blur(6px);
}

.home-icon:hover {
  background-color: rgba(255, 255, 255, 0.4);
  color: black;
}


  </style>
</head>
<body>
  <a href="index.html" class="home-icon" title="Go to Home">
    <i class="fas fa-home"></i> Home
  </a>
  

  <div class="login-box">
    <h2>Login</h2>
    <form id="loginForm">
      <input type="email" id="email" placeholder="Email Address" required />
      <input type="password" id="password" placeholder="Password" required />
      <select id="role" required>
        <option value="">Select Role</option>
        <option value="jobseeker">Job Seeker</option>
        <option value="employer">Employer</option>
        <option value="admin">Admin</option>
      </select>
      <button type="submit">Login</button>
    </form>
    <div class="footer-link">
      Don’t have an account? <a href="register.html">Register here</a>
    </div>
  </div>

  <script>
    document.getElementById("loginForm").onsubmit = async (e) => {
      e.preventDefault();
  
    
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const role = document.getElementById("role").value;
  
      
      try {
        const response = await fetch("http://localhost:3001/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password, role }) 
        });
  
        const data = await response.json();
  
        if (response.ok && data.success) {
          
          localStorage.setItem("userId", data.user.id);
          localStorage.setItem("userRole", data.user.role);
  
          
          if (data.user.role === "jobseeker") {
            window.location.href = "jobseeker.html";
          } else if (data.user.role === "employer") {
            window.location.href = "employer.html";
          } else if (data.user.role === "admin") {
            window.location.href = "admin.html";
          } else {
            alert("Unknown role. Redirecting to homepage.");
            window.location.href = "index.html";
          }
  
        } else {
          
          alert(data.message || "Login failed. Please check your credentials.");
          
        }
      } catch (error) {
        console.error("Error:", error);
        alert("Server error. Please try again later.");
      }
    };
  </script>
  
  
</body>
</html>
