<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Job Seeker Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f4f8;
      color: #333;
    }

    header {
      background-color: #4a90e2;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .profile-container {
      max-width: 700px;
      margin: 40px auto;
      background-color: white;
      padding: 30px 40px;
      border-radius: 15px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
    }

    .profile-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .profile-header img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #4a90e2;
    }

    .upload-btn {
      margin-top: 10px;
      font-size: 14px;
      color: #4a90e2;
      cursor: pointer;
    }

    .profile-header h2 {
      margin-top: 15px;
      font-size: 24px;
      color: #4a90e2;
    }

    .profile-form label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 5px;
    }

    .profile-form input,
    .profile-form textarea,
    .profile-form select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .profile-form textarea {
      resize: vertical;
      min-height: 100px;
    }

    .save-btn {
      display: inline-block;
      margin-top: 25px;
      background-color: #4a90e2;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.3s;
    }

    .save-btn:hover {
      background-color: #357abd;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 30px;
      color: #4a90e2;
      text-decoration: none;
      font-weight: bold;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    input[type="file"] {
      display: none;
    }

    @media (max-width: 600px) {
      .profile-container {
        padding: 20px;
      }

      .profile-header img {
        width: 90px;
        height: 90px;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>My Profile</h1>
  </header>

  <div class="profile-container">
    <div class="profile-header">
      <img id="profilePic" src="https://via.placeholder.com/120" alt="Profile Picture">
      <br>
      <label for="uploadImage" class="upload-btn"><i class="fas fa-camera"></i> Choose Image</label>
      <input type="file" id="uploadImage" accept="image/*">
      <h2>John Doe</h2>
    </div>

    <form class="profile-form">
      <label for="fullname">Full Name</label>
      <input type="text" id="fullname" placeholder="Enter your full name">

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="example@email.com">

      <label for="phone">Phone Number</label>
      <input type="text" id="phone" placeholder="+91 9876543210">

      <label for="location">Location</label>
      <input type="text" id="location" placeholder="City, Country">

      <label for="skills">Skills</label>
      <textarea id="skills" placeholder="E.g., JavaScript, React, Node.js"></textarea>

      <label for="experience">Experience Level</label>
      <select id="experience">
        <option value="" disabled selected>Select experience</option>
        <option>Fresher</option>
        <option>1-2 years</option>
        <option>3-5 years</option>
        <option>5+ years</option>
      </select>

      <button type="submit" class="save-btn"><i class="fas fa-save"></i> Save Changes</button>
    </form>

    <a href="jobseeker.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
  </div>

  <script>
    
    const uploadInput = document.getElementById("uploadImage");
    const profilePic = document.getElementById("profilePic");

    uploadInput.addEventListener("change", function () {
      const file = this.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function (e) {
          profilePic.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    });
  </script>

</body>
</html>
