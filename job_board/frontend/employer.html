<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Employer Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to right, #667eea, #764ba2);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .dashboard-card {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      backdrop-filter: blur(20px);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
      padding: 40px;
      width: 100%;
      max-width: 600px;
      animation: fadeIn 0.6s ease-in-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h2 {
      text-align: center;
      color: #fff;
      margin-bottom: 30px;
      font-size: 28px;
    }

    input, textarea {
      width: 100%;
      padding: 14px;
      margin: 10px 0 20px 0;
      border: none;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.3);
      color: #fff;
      font-size: 16px;
      transition: background 0.3s ease;
    }

    input:focus, textarea:focus {
      background: rgba(255, 255, 255, 0.5);
      outline: none;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    ::placeholder {
      color: #eee;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(to right, #00b09b, #96c93d);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background: linear-gradient(to right, #96c93d, #00b09b);
      transform: scale(1.02);
    }

    .footer {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
      color: #eee;
    }

    @media (max-width: 600px) {
      .dashboard-card {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="dashboard-card">
    <h2><i class="fas fa-briefcase"></i> Post a New Job</h2>
    <form id="postJobForm">
      <input type="text" id="title" placeholder="Job Title" required />
      <textarea id="description" placeholder="Job Description" required></textarea>
      <input type="text" id="location" placeholder="Location" required />
      <input type="text" id="category" placeholder="Category" required />
      <button type="submit"><i class="fas fa-paper-plane"></i> Post Job</button>
    </form>
    <div class="footer">
      &copy; 2025 JobBoard &mdash; Empowering Employers
    </div>
  </div>

  <script>
    document.getElementById("postJobForm").onsubmit = async (e) => {
      e.preventDefault();

      const job = {
        title: document.getElementById("title").value,
        description: document.getElementById("description").value,
        location: document.getElementById("location").value,
        category: document.getElementById("category").value,
        employer_id: 1 // Replace with real session user ID dynamically
      };

      const res = await fetch("http://localhost:3001/jobs", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(job)
      });

      const result = await res.text();
      alert(result);
    };
  </script>

</body>
</html>
