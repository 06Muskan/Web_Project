<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel - Manage Jobs</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #f5f7fa;
      margin: 0;
      padding: 40px;
    }
    .container {
      max-width: 900px;
      margin: auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }
    .top-bar {
      text-align: right;
      margin-bottom: 10px;
    }
    .home-btn {
      display: inline-block;
      padding: 10px 18px;
      background-color: #3498db;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      transition: background 0.3s ease;
    }
    .home-btn:hover {
      background-color: #2980b9;
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #333;
    }
    form {
      display: grid;
      gap: 20px;
      margin-bottom: 40px;
    }
    input, textarea, button {
      padding: 14px;
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }
    textarea {
      resize: vertical;
    }
    button {
      background: #4CAF50;
      color: white;
      font-weight: bold;
      border: none;
      transition: background 0.3s ease;
      cursor: pointer;
    }
    button:hover {
      background: #45a049;
    }
    .job-list {
      margin-top: 20px;
    }
    .job-card {
      background: #f9f9f9;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 10px;
      border-left: 5px solid #4CAF50;
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
    }
    .job-card h3 {
      margin: 0 0 10px;
      color: #333;
    }
    .job-card p {
      margin: 5px 0;
      color: #666;
    }
    .delete-btn {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 15px;
      background: #e74c3c;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .delete-btn:hover {
      background: #c0392b;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="top-bar">
    <a href="index.html" class="home-btn">Home</a>
  </div>

  <h1>Admin Panel - Manage Jobs</h1>

  <form id="add-job-form">
    <input type="text" id="title" placeholder="Job Title" required>
    <input type="text" id="location" placeholder="Location" required>
    <input type="text" id="category" placeholder="Category" required>
    <input type="number" id="employer_id" placeholder="Employer ID" required>
    <textarea id="description" placeholder="Job Description" rows="5" required></textarea>
    <button type="submit">Add Job</button>
  </form>

  <div class="job-list" id="job-list">
    <h2 style="color: #333; margin-bottom: 15px;">All Jobs</h2>
    <!-- Jobs will appear here -->
  </div>
</div>

<script>
document.getElementById('add-job-form').addEventListener('submit', function(e) {
  e.preventDefault();

  const job = {
    title: document.getElementById('title').value,
    location: document.getElementById('location').value,
    category: document.getElementById('category').value,
    employer_id: document.getElementById('employer_id').value,
    description: document.getElementById('description').value
  };

  fetch('http://localhost:3001/api/add-job', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(job)
  })
  .then(response => response.json())
  .then(data => {
    if (data.success) {
      alert('Job added successfully!');
      document.getElementById('add-job-form').reset();
      loadJobs(); 
    } else {
      alert('Failed to add job');
    }
  })
  .catch(error => console.error('Error:', error));
});

// Load Jobs
function loadJobs() {
  fetch('http://localhost:3001/api/jobs')
    .then(response => response.json())
    .then(jobs => {
      const jobList = document.getElementById('job-list');
      jobList.innerHTML = '<h2 style="color: #333; margin-bottom: 15px;">All Jobs</h2>';
      jobs.forEach(job => {
        const jobDiv = document.createElement('div');
        jobDiv.className = 'job-card';
        jobDiv.innerHTML = `
          <h3>${job.title}</h3>
          <p><strong>Location:</strong> ${job.location}</p>
          <p><strong>Category:</strong> ${job.category}</p>
          <p><strong>Employer:</strong> ${job.employer_name}</p>
          <p>${job.description}</p>
          <button class="delete-btn" onclick="deleteJob(${job.id})">Delete Job</button>
        `;
        jobList.appendChild(jobDiv);
      });
    })
    .catch(error => console.error('Error:', error));
}

// Delete Job
function deleteJob(id) {
  if (confirm('Are you sure you want to delete this job?')) {
    fetch(`http://localhost:3001/api/delete-job/${id}`, {
      method: 'DELETE'
    })
    .then(response => response.json())
    .then(data => {
      if (data.success) {
        alert('Job deleted successfully!');
        loadJobs(); 
      } else {
        alert('Failed to delete job');
      }
    })
    .catch(error => console.error('Error:', error));
  }
}

loadJobs();
</script>

</body>
</html>
